<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}המלצה – עלמה{% endblock %}</title>
  <link rel="icon" href="{{ site_url }}/images/alma-favicon-new.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as site/styles.css */
    :root{--bg:hsl(30 25% 94%);--fg:hsl(25 30% 15%);--card:hsl(30 20% 90%);--muted:hsl(25 20% 38%);
      --border:hsl(25 20% 78%);--border-strong:hsl(25 25% 60%);--primary:hsl(25 65% 45%);--radius:1rem;
      --shadow:0 18px 36px -12px hsla(25,30%,20%,.16);
      --overlay:linear-gradient(180deg,hsla(25,30%,12%,.15) 0%,hsla(25,30%,12%,.55) 60%,hsl(30 25% 94%) 100%);}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:"Rubik","Segoe UI",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:"Secular One","Segoe UI",sans-serif;font-weight:400;margin:0}
    .band{position:relative;min-height:190px;display:flex;align-items:flex-end;justify-content:center;
      background:#000 url("{{ site_url }}/images/new_background.jpg") center/cover no-repeat}
    .band::after{content:"";position:absolute;inset:0;background:var(--overlay)}
    .band a{position:relative;z-index:1;margin-bottom:-10px}
    .band img{display:block;width:min(180px,46vw);filter:drop-shadow(0 6px 22px hsla(25,30%,8%,.55))}
    main{width:100%;max-width:{% block width %}560px{% endblock %};margin:0 auto;padding:1.5rem 20px 3rem}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.6rem;text-align:center}
    .panel h1{font-size:1.7rem;margin-bottom:.6rem}
    p{margin:.4rem 0 1.2rem;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:999px;font:inherit;
      font-weight:700;border:1px solid var(--border-strong);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none;transition:transform .2s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:var(--fg);color:#fff;border-color:var(--fg)}
    form{text-align:right}
    label{display:block;font-weight:700;margin:.9rem 0 .3rem}
    input,textarea,select{width:100%;font:inherit;padding:.7rem;border:1px solid var(--border);border-radius:.6rem;background:#fff;color:var(--fg)}
    input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
    .errors{color:#a4262c;font-size:.92rem}
    .errors ul{margin:.3rem 0;padding:0;list-style:none}
    .actions{text-align:center;margin-top:1.4rem}
    .back{display:inline-block;margin-top:1rem;color:var(--muted)}
    .hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <header class="band"><a href="{{ site_url }}"><img src="{{ site_url }}/images/alma-icon.png" alt="עלמה – חזרה לאתר"></a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
